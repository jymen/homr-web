<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link
      href="https://fonts.googleapis.com/css2?family=Satisfy&family=Cinzel&display=block"
      rel="stylesheet"
    >
    <style>
    html,
    body {
      margin: 0;
      background: #fff;
    }
    #page {
      box-sizing: border-box;
      width: 2481px;
      height: 3509px;
      padding: 150px 140px 0;
    }
    </style>
  </head>
  <body>
    <div id="page"><div id="score"></div></div>
    <script src="abcjs-basic-min.js"></script>
    <script>
    "use strict";
    const abc = `% Default header template begins
% can be changed in preferences
%%vocalfont Bookman-Light 12
%%historyfont Bookman-Light 10
%%wordsfont Bookman-Light 14
%%composerfont Bookman-Light 12
%%titlefont Cinzel 26
%%gchordfont Satisfy 14
%%annotationfont Satisfy 14
% Default header template ends
X:1
T:Chord Study
M:4/4
L:1/8
K:G
"G"G2 B2 d2 B2 | "Em"e2 g2 e2 B2 | "Am7"A2 c2 e2 c2 | "D7"d2 f2 a2 f2 |
"C"c2 e2 g2 e2 | "Bm"B2 d2 f2 d2 | "Am"A2 c2 "D"d2 f2 | "G"g8 |
"F#m"f2 a2 c'2 a2 | "B7"B2 d2 f2 a2 | "Em"e2 g2 "A7"a2 g2 | "D"d8 |
"G"B2 d2 "Cmaj7"e2 g2 | "Am"c2 e2 "D7"f2 a2 | "Em"g2 e2 "C"c2 e2 | "G"G8 |]`;
    Promise.all([
      document.fonts.load("14px Satisfy"),
      document.fonts.load("26px Cinzel"),
    ]).then(() => {
      ABCJS.renderAbc("score", abc, { responsive: "resize", staffwidth: 700 });
      document.title = "ready";
    });
    </script>
  </body>
</html>
