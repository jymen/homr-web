name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The models are git-ignored; the key follows the hashes the manifest pins.
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('src/models/manifest.ts') }}
      - run: tools/download-models.sh
        env:
          HOMR_WEB_MODELS_RELEASE: models-homr0.7.0
      - run: npm run check
      - run: npm run lint
      - run: npm test
